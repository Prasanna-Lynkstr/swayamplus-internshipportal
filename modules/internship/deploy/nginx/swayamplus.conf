# IP-only reverse proxy: everything on port 80, same origin for frontend
# and API (so no CORS is actually exercised in the browser — it only sees
# http://<vps-ip>/... for both). Swap `listen 80` for TLS + server_name once
# a domain exists; see deploy/README.md's "Adding a domain + HTTPS later" section.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10M;

    # Backend API — path prefix matches NestJS's global prefix (see backend/src/main.ts).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded resumes / verification documents (STORAGE_DRIVER=local — see
    # backend's app.useStaticAssets in src/main.ts).
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Health check + Swagger docs, both excluded from the /api/v1 prefix.
    location /health {
        proxy_pass http://127.0.0.1:4000;
    }
    location /docs {
        proxy_pass http://127.0.0.1:4000;
    }

    # Everything else — the Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
